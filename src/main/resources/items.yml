# MCPiyasa varsayılan fiyat listesi: 151 item anahtarı.
# Sayım yöntemi: rg '^  [A-Z0-9_]+:' src/main/resources/items.yml
# Fiyatlar vanilla survival birim başına edinim zorluğu başlangıç tahminidir.
# Hasat verimleri Java Edition 1.21 crop/loot tablolarına göre brüt ve yeniden
# dikim sonrası net olarak not edilir; Fortune gibi bonuslar hesaba katılmaz.
# Deterministik işleme akrabaları tarif kütlesiyle aynı grubu paylaşır; çok
# girdili çevrim riskli çıktıların satış yönü kapalıdır. Yönetici değerleri değiştirebilir.
# Sürümde olmayan item'lar otomatik atlanır; yapılandırma hataları teşhise girer.

kategoriler:
  madenler:  { ikon: IRON_PICKAXE, sira: 1 }
  tarim:     { ikon: WHEAT, sira: 2 }
  mob:       { ikon: BONE, sira: 3 }
  yapi:      { ikon: BRICKS, sira: 4 }
  nether-end: { ikon: NETHERRACK, sira: 5 }
  nadir:     { ikon: NETHER_STAR, sira: 6 }

